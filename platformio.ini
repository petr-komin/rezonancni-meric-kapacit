; Rezonancni meric kapacit - STM32F103C8 (Blue Pill)
; Programator: ST-Link V2

[env]
platform = ststm32
board = bluepill_f103c8
; pokud ma tvuj klon 128 kB flash, zmen na: board = bluepill_f103c8_128k
framework = arduino

upload_protocol = stlink
debug_tool = stlink

; Deska neni original ST, ale klon (CKS32/CS32F103) a hlasi se jinym
; idcode, nez OpenOCD ceka. Bez tohohle upload skonci hlaskou
; "UNEXPECTED idcode: 0x2ba01477".
upload_flags =
    -c
    set CPUTAPID 0x2ba01477
debug_server =
    $PLATFORMIO_CORE_DIR/packages/tool-openocd/bin/openocd
    -s
    $PLATFORMIO_CORE_DIR/packages/tool-openocd/openocd/scripts
    -f
    interface/stlink.cfg
    -c
    set CPUTAPID 0x2ba01477
    -f
    target/stm32f1x.cfg

; USB NECHAVAME UPLNE VYPNUTE. Pozor: -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC=0
; USB *nevypne, ale zapne* - PlatformIO testuje jen pritomnost toho
; retezce, ne jeho hodnotu. Na klonu Blue Pillu se pak USB porad dokola
; resetuje, zahlti procesor v IRQ a setup()/loop() se nerozebehnou.
; Seriovy vypis jde pres USART1 (PA9/PA10).
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9

; ---------------------------------------------------------------
; Normalni test displeje:  pio run -t upload
; ---------------------------------------------------------------
[env:bluepill_f103c8]
; Zkusebni generator na PB6 je vychozi VYPNUTY. Na overeni mericiho
; retezce ho zapni a propoj PB6 -> PA0; mericka musi ukazat presne
; nastavenou hodnotu.
;build_flags = -D TESTSIGNAL_HZ=10000
;
; Kalibrace kapacity - dve mereni se ZNAMYMI kondenzatory [Hz, pF].
; Prvni bod je naprazdno (0 pF), druhy s referencnim kondenzatorem.
;
;
; Referencni je kondenzator 139 pF s tolerenci 1 %, takze absolutni
; presnost stupnice je 1 %.
;
; Historie, at je jasne, proc se to menilo:
;  * Nejdriv modry keramicky "220 pF" na kilovolt - ukazalo se, ze
;    ma ve skutecnosti 179 pF (o 19 % vedle). Typicke pro keramiku
;    Y5V/Z5U, na kalibraci naprosto nevhodne.
;  * Pak slidovy znaceny 62 pF +-2 % - ten ma ve skutecnosti 63,45 pF,
;    tedy o 2,3 % vic, tesne za svou toleranci.
;  * Ted 139 pF +-1 %.
;
; Prekalibrovano po vymene pripojovaciho konektoru u kapacit: ten
; pridal 0,24 pF, takze C0 vzroslo z 6,72 na 6,96 pF.
; Obe frekvence odecteny az po TEPELNEM USTALENI - oscilator se
; usazuje asi 10 minut, viz docs/mereni-kapacity.md.
build_flags =
    -D KAL_F1=35354000.0 -D KAL_C1=0.0
    -D KAL_F2=7722000.0  -D KAL_C2=139.0

; ---------------------------------------------------------------
; Hledani nejvyssi spolehlive rychlosti:
;   pio run -e kalibrace -t upload
; ---------------------------------------------------------------
[env:kalibrace]
build_flags = -D REZIM_KALIBRACE -D ZPOZDENI_TEST=10
; Soubory citace se do tohohle testu vubec neprekladaji. PlatformIO
; jinak bere cely adresar src/, takze by se linkovaly i kdyz se
; nevolaji - a "bez citace" by to nikdy nebylo.
build_src_filter = +<*> -<frekvence.cpp> -<testsignal.cpp>

; ---------------------------------------------------------------
; Promereni vodicu k displeji: pio run -e piny -t upload
; ---------------------------------------------------------------
[env:piny]
build_flags = -D REZIM_PINY
